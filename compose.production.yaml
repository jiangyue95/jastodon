name: jastodon-production

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: jastodon
      POSTGRES_USER: jastodon
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jastodon -d jastodon"]
      interval: 5s
      retries: 10
    mem_limit: 384m
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/jastodon
      SPRING_DATASOURCE_USERNAME: jastodon
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?GITHUB_CLIENT_ID is required}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?GITHUB_CLIENT_SECRET is required}
      JASTODON_FEDERATION_BASEURL: https://${JASTODON_DOMAIN:?JASTODON_DOMAIN is required}
      JASTODON_FEDERATION_PRIVATEKEYLOCATION: file:/run/secrets/actor_private_key
      JASTODON_MEDIA_BASEURL: ${JASTODON_MEDIA_BASE_URL:?JASTODON_MEDIA_BASE_URL is required}
      JASTODON_MEDIA_STORAGE_BUCKET: ${JASTODON_MEDIA_BUCKET:?JASTODON_MEDIA_BUCKET is required}
      JASTODON_MEDIA_STORAGE_ACCESSKEYID: ${JASTODON_MEDIA_ACCESS_KEY_ID:?JASTODON_MEDIA_ACCESS_KEY_ID is required}
      JASTODON_MEDIA_STORAGE_SECRETACCESSKEY: ${JASTODON_MEDIA_SECRET_ACCESS_KEY:?JASTODON_MEDIA_SECRET_ACCESS_KEY is required}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75
      SERVER_FORWARDHEADERSSTRATEGY: native
    secrets:
      - actor_private_key
    mem_limit: 768m
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    environment:
      JASTODON_DOMAIN: ${JASTODON_DOMAIN:?JASTODON_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - ${JASTODON_FRONTEND_DIST:?JASTODON_FRONTEND_DIST is required}:/srv/compose:ro
    mem_limit: 128m
    restart: unless-stopped

secrets:
  actor_private_key:
    file: ./secrets/actor-private-key.pem

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
