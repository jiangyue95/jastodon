spring:
  application:
    name: jastodon

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}

jastodon:
  owner:
    github-id: 20340265
  federation:
    username: yue
    base-url: http://localhost:8080
    private-key-location: file:secrets/actor-private-key.pem
  media:
    base-url: https://media.jastodon.invalid
    storage:
      bucket: NOT-CONFIGURED
      region: eu-west-1
      access-key-id: NOT-CONFIGURED
      secret-access-key: NOT-CONFIGURED
  delivery:
    enabled: true
